query RunInput($collections: [ID!]) {
  cart {
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inAnyCollection(ids: $collections)
            inCollections(ids: $collections) {
              collectionId
            }
          }
        }
      }
    }
  }
  discountNode {
    metafield(namespace: "$app:example-discounts--ui-extension", key: "function-configuration") {
      value
    }
  }
}
